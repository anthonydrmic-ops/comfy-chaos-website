<style>
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;src:url(/assets/fonts/space-grotesk-latin-wght.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(/assets/fonts/inter-latin-wght.woff2) format('woff2')}
  :root{
    --cyan:#22c7f5;--sky:#38bdf8;--blue:#3b6bff;--indigo:#4b57f0;--violet:#6d3cf2;
    --grad:linear-gradient(135deg,var(--cyan) 0%,var(--blue) 45%,var(--violet) 100%);
    --grad-btn:linear-gradient(135deg,#4b57f0,#6d3cf2);
    --bg:#05060c;--ink:#f2f5ff;--ink-2:#b7c0dc;--ink-3:#8791b0;
    --r-media:10px;--r-pill:999px;--header-h:70px;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--display:'Space Grotesk',var(--font);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.65;
    min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr;overflow-x:hidden;
    background-image:radial-gradient(60% 55% at 72% 0%,rgba(59,107,255,.14),transparent 70%)}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--sky);outline-offset:3px}
  a:focus-visible{border-radius:4px}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:linear-gradient(rgba(120,150,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,255,.045) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%);
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%)}
  header{border-bottom:1px solid rgba(140,160,255,.08)}
  .nav{max-width:1200px;margin:0 auto;padding:0 24px;height:var(--header-h);display:flex;align-items:center}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{height:34px;width:auto;display:block}
  .brand-name{font-family:var(--display);font-weight:700;font-size:1.12rem;letter-spacing:.06em;white-space:nowrap}
  main{display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:40px 24px 56px}
  img.mark{display:block;width:120px;height:auto;margin-bottom:10px;filter:drop-shadow(0 12px 40px rgba(59,107,255,.22))}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(3.4rem,12vw,6rem);letter-spacing:-.02em;line-height:1;color:var(--ink)}
  h2{font-family:var(--display);font-weight:500;font-size:clamp(1.1rem,3vw,1.5rem);line-height:1.25}
  p{color:var(--ink-3);max-width:44ch;text-wrap:pretty}
  a.btn{display:inline-flex;align-items:center;gap:9px;margin-top:18px;padding:14px 28px;border-radius:var(--r-pill);text-decoration:none;
    font-weight:600;font-size:.98rem;line-height:1.3;color:#fff;background:var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(34,199,245,.55),0 8px 24px rgba(75,87,240,.28);transition:transform .16s,box-shadow .16s}
  a.btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(34,199,245,.7),0 12px 30px rgba(75,87,240,.4)}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
